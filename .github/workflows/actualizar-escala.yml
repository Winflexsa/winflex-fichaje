name: Actualizar escala UOYEP

on:
  schedule:
    # 1° de cada mes, 09:00 UTC (~06:00 ART). También algunos días extra
    # por si UOYEP publica la nueva paritaria a mitad de período.
    - cron: '0 9 1,5,10,20 * *'
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write           # necesario para que el bot commitee escala.json

concurrency:
  group: escala-uoyep
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install cheerio --no-save

      - name: Scrapear escala
        run: node scripts/scrape-escala.js

      - name: Commitear si cambió
        run: |
          git config user.name  "winflex-escala-bot"
          git config user.email "actions@users.noreplace.github.com"
          git add escala.json
          if git diff --staged --quiet; then
            echo "Sin cambios en la escala — no se commitea."
          else
            git commit -m "Actualizar escala UOYEP ($(date +%Y-%m-%d))"
            git push
          fi
